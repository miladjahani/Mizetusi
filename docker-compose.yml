# NEXUS on a VPS — the deployment where every transport is available.
#
#   NEXUS_PUBLIC_DOMAIN=panel.example.com docker compose up -d --build
#
# The ports are published on purpose:
#   * 8080 — the panel and the whole WebSocket edge (VLESS/VMess/Trojan/…);
#   * 8443 — the raw TCP port Reality terminates TLS on. Nothing has to be
#     configured in the panel: on a host with a public port the direct endpoint
#     is detected, the Reality inbound is generated and the link is published;
#   * 8446/8448/8449 — the Telegram proxies, each a raw TCP listener: MTProto
#     (8446), the HTTP web proxy (8448) and the SOCKS5 one (8449). They stay
#     idle until an admin switches them on in the «پروکسی تلگرام» tab, so the
#     published ports cost nothing but a closed port is what "the card says
#     published and nothing connects" looks like;
#   * 10101-10106 — the advanced transports (XHTTP, gRPC, HTTPUpgrade) behind
#     Reality, one port each, published for the same reason: they stay closed
#     until «مبهم‌سازی پیشرفته» switches one on, and the panel only offers a
#     link for a port that is really open here.
#
# Open them in the firewall (ufw allow 8080,8443,8446,8448,8449,10101,10102,10104,10105,10106/tcp;
# or the cloud security group) and point a domain (or a Cloudflare-proxied one) at the
# host if you want TLS in front of the panel too. NET_ADMIN is only needed by
# the optional WARP exit.
services:
  nexus:
    build: .
    image: nexus-railway-python-auto
    restart: unless-stopped
    ports:
      # The panel and the whole WebSocket edge. With the ``tls`` profile running
      # (the ``edge`` service below) nothing needs this published on the host at
      # all: replace it with ``'127.0.0.1:8080:8080'`` — or drop the line — and
      # the panel is reachable only through the proxy, at ``/admin``.
      - '8080:8080'
      - '8443:8443'
      - '8446:8446'   # MTProto proxy (mtg)
      - '8448:8448'   # HTTP web proxy
      - '8449:8449'   # SOCKS5 web proxy
      # Advanced obfuscation, one port per transport (off until an admin
      # switches it on in the panel).
      - '10101:10101' # VLESS · gRPC
      - '10102:10102' # VLESS · HTTPUpgrade
      - '10104:10104' # VLESS · XHTTP (H2/H3)
      - '10105:10105' # VMess · gRPC
      - '10106:10106' # Trojan · gRPC
    environment:
      PORT: '8080'
      # Overridable because the same stack runs two ways. `vps` (the default) is
      # the host that owns its ports. `tunnel` is the same host reached only
      # through the ``tunnel`` profile below — see app/runtime.py, which then
      # stops advertising a raw TCP endpoint a NAT'd machine cannot serve.
      # scripts/install-vps.sh --tunnel sets it.
      NEXUS_PLATFORM: '${NEXUS_PLATFORM:-vps}'
      # Set this to the domain clients should use; leave empty to fall back to
      # the machine's own public IP for the origin node.
      NEXUS_PUBLIC_DOMAIN: '${NEXUS_PUBLIC_DOMAIN:-}'
      # The base every subscription URL is built from. Behind a domain (or a
      # CDN) the request's own Host would be the container's, so this is what
      # makes a link handed to a user point at the real address. scripts/install-vps.sh
      # writes it when --domain is given.
      PUBLIC_BASE_URL: '${PUBLIC_BASE_URL:-}'
      # Auto-detected when empty (public IP + 8443 via app.runtime).
      NEXUS_DIRECT_HOST: '${NEXUS_DIRECT_HOST:-}'
      NEXUS_DIRECT_PORT: '${NEXUS_DIRECT_PORT:-8443}'
      SQLITE_PATH: /data/nexus.db
      XRAY_ENABLED: 'true'
      ADMIN_PASSWORD: '${ADMIN_PASSWORD:-admin}'
      JWT_SECRET: '${JWT_SECRET:-}'
      WARP_ENABLED: '${WARP_ENABLED:-0}'
      # The Telegram proxies are off until an admin enables them in the panel;
      # these are only the ports they will listen on.
      NEXUS_TELEGRAM_MTPROTO_PORT: '8446'
      NEXUS_TELEGRAM_HTTP_PORT: '8448'
      NEXUS_TELEGRAM_SOCKS_PORT: '8449'
    volumes:
      - ./data:/data
    # Container hardening. The process needs exactly one capability — the WARP
    # exit is a WireGuard tunnel, which is the only thing here that asks for
    # NET_ADMIN — so everything else is dropped, and the image cannot gain
    # privileges it was not started with. A container that can only do what the
    # panel's job is is a container an intruder cannot make do anything else.
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    tmpfs:
      # Nothing is written outside /data (a volume) and /tmp; the root
      # filesystem is left as the image built it.
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    healthcheck:
      test: ['CMD', 'python', '-c', "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.getenv('PORT','8080')+'/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------------- the TLS edge
  # Opt-in (``docker compose --profile tls up -d``) and the single biggest thing
  # a VPS deployment can do about being watched: the panel and the whole
  # WebSocket edge terminate real TLS in front, so nothing about them — not the
  # login, not a subscription, not a node's upgrade — crosses the network in the
  # clear, and the origin port (8080) can be bound to loopback alone.
  #
  # It needs a real domain pointing at the host (ports 80/443 open) for the
  # automatic certificate. Set NEXUS_DOMAIN and start it with the profile; the
  # deployment's main address then opens the panel at ``/admin``. A host that
  # already runs nginx can use ``deploy/nginx.conf.example`` instead, which
  # serves the same shape.
  edge:
    image: caddy:2-alpine
    profiles: ['tls']
    restart: unless-stopped
    depends_on:
      - nexus
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'      # HTTP/3, same shape a browser would use
    environment:
      NEXUS_DOMAIN: '${NEXUS_DOMAIN:-}'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # -------------------------------------------------- the free public address
  # Opt-in (``docker compose --profile tunnel up -d``) and the only way this
  # stack gets a public HTTPS name without a public IP, an open port, a paid host
  # or a credit card — which is what makes it the free deployment
  # (docs/FREE-DEPLOY-FA.md).
  #
  # ``cloudflared`` dials *out* to Cloudflare and holds that connection open, so:
  #   * nothing has to be forwarded on the router and no port has to be opened
  #     on the host, so a machine behind NAT — a home connection, a Raspberry Pi,
  #     an old laptop — is a valid place to run this;
  #   * the public name is a subdomain of a domain the Cloudflare account owns,
  #     so clients get Cloudflare's anycast IPs instead of the host's address;
  #   * it is free. No plan to buy, no card to enter.
  #
  # Create the tunnel once (Cloudflare Zero Trust → Networks → Tunnels → Create),
  # point its public hostname at ``http://nexus:8080`` — the *compose service
  # name*, not localhost, because cloudflared resolves it on the compose network —
  # and put the token in .env as ``CLOUDFLARE_TUNNEL_TOKEN``.
  # ``scripts/install-vps.sh --tunnel <token>`` writes that and starts this profile.
  #
  # Only HTTP(S) and WebSocket upgrades cross this tunnel, so with it the panel
  # and the WebSocket transports are live while the raw-TCP ones (Reality, AnyTLS,
  # MTProto) are not — that is why --tunnel also sets NEXUS_PLATFORM=tunnel. If
  # this machine really does have a public IP and a forwarded port, set
  # NEXUS_DIRECT_HOST/NEXUS_DIRECT_PORT and the panel will publish it.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ['tunnel']
    restart: unless-stopped
    depends_on:
      - nexus
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - '${CLOUDFLARE_TUNNEL_TOKEN:-}'

volumes:
  caddy-data:
  caddy-config:
